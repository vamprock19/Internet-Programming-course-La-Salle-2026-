<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Movie Ticket Booking Form</h1>
    <form>
      <fieldset>
        <legend>Customer Information</legend>
        <label for="name">Full Name:</label>
        <input type="text" placeholder="Enter your full name" /><br /><br />
        <label for="Password">Password:</label>
        <input type="password" /><br /><br />
        <label for="email">Email:</label>
        <input type="email" placeholder="example@gmail.com" /><br /><br />
        <label for="phone">Phone :</label>
        <input type="number" placeholder="514-555-1234" /><br /><br />
        <label for="website">Website:</label>
        <input type="url" placeholder="https://www.example.com" /><br /><br />
      </fieldset>
 
      <fieldset>
        <legend>Movie Information</legend>
        <label for="movie">Choose the Movie:</label>
        <select id="movie" name="movie">
          <optgroup label="Action">
            <option value="Fast & Furious">Fast & Furious</option>
          </optgroup>
          <optgroup label="Comedy">
            <option value="The Mask">The Mask</option>
            <option value="Mr. Bean">Mr. Bean</option>
          </optgroup>
          <optgroup label="Sci-Fi">
            <option value="Interstellar">Interstellar</option>
            <option value="Avatar">Avatar</option>
          </optgroup>
        </select>
        <br /><br />
 
        <label for="search">Search for a movie:</label>
        <input
          type="search"
          id="search"
          name="search"
          placeholder="Enter movie name"
        />
      </fieldset>
 
      <fieldset>
        <legend>Show Information</legend>
        <label for="showDate">Show Date:</label>
        <input type="date" id="showDate" name="showDate" />
        <br /><br />
        <label for="showTime">Show Time:</label>
        <input type="time" id="showTime" name="showTime" />
        <br /><br />
        <label>Special Event:</label>
        <input type="datetime-local" id="specialEvent" name="specialEvent" />
        <br /><br />
        <label for="preferd Month">Preferd Month:</label>
        <input type="month" id="preferd Month" name="preferd Month" />
        <br /><br />
        <label for="week">Preferd Week:</label>
        <input type="week" id="week" name="week" />
      </fieldset>
 
      <fieldset>
        <legend>Ticket Information</legend>
        <label for="ticketCount">Number of Tickets:</label>
        <input
          type="number"
          id="ticketCount"
          name="ticketCount"
          min="1"
          max="10"
        />
        <br /><br />
        <p>Ticket types:</p>
        <input type="radio"  name="ticketType"  />
        <label for="adult">Adult</label><br />
        <input type="radio"  name="ticketType"  />
        <label for="child">Child</label><br />
        <input type="radio"  name="ticketType"  />
        <label for="senior">Senior</label><br /><br />
      </fieldset>
 
      <fieldset>
        <legend>Movie Extra:</legend>
        <p>Select your Extra:</p>
        <input type="checkbox"  />
        <label for="popcorn">Popcorn</label><br />
        <input type="checkbox"  />
        <label for="drink">Soft Drink</label><br />
        <input type="checkbox"  />
        <label for="NAchos">Nachos</label><br />
      </fieldset>
 
      <fieldset>
        <legend>Movie Preferences</legend>
        <label for="volume">Trailer Volume:</label>
        <input type="range"  min="0" max="100" />
        <br><br>
        <label for="color">Choose your favorite color:</label>
        <input type="color" id="color" />
      </fieldset>
 
      <fieldset>
        <legend>File Upload</legend>
        <label>Upload a Movie Poster:</label>
        <input type="file" />
        <br><br>
        <label >upload multiple files</label>
        <input type="file" multiple />
      </fieldset>
 
      <fieldset>
        <legend>Comments and Requests</legend>
        <label for="comments">Special Comments :</label><br />
        <textarea name="comments" rows="4" cols="50"></textarea>
      </fieldset>
 
      <fieldset>
        <legend>Booking Security</legend>
        <label>4-digit Booking Code:</label>
        <input type="text" placeholder="1234" />
      </fieldset>
 
      <label>Selected Cinema:</label>
      <input type="text" value="DownTown Cinema" readonly />
      <br><br>
      <label>discount:</label>
      <input type="text" value="Currently unavailable" disabled />
      <br><br>
      <input type="submit" value="Book the Ticket" />
      <input type="reset" value="Clear Form" />
      <button>Check Availability</button>
      <input type="button" value="Print information"  />
    </form>
  </body>
</html>
