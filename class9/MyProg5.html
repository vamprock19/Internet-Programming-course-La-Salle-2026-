<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .my-list 
        {
            list-style-type: none;
    
        }
        .orderlist 
        {
            list-style-type: decimal-leading-zero;
            list-style-position: outside;
        }
        .test 
        {
            list-style-image: url("star.png");
        }
    </style>
</head>
<body>
    <ul class="my-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <ol class="orderlist">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ol>

    <ul class="test">
        <li>Item 5</li>
        <li>Item 6</li>
    </ul>
</body>
</html>
