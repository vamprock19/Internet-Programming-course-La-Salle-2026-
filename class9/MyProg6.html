<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link 
        {
            color: rgb(0, 255, 21);
            text-decoration: none;
        }
        a:visited 
        {
            color: rgb(255, 0, 55);
        }
        a:hover 
        {
            color: rgb(0, 0, 255);
            text-decoration: underline;
        }
        a:active 
        {
            color: rgb(255, 255, 0);
        }
    </style>
</head>
<body>
    <a href="https://www.example.com">Visit Example</a>
</body>
</html>
