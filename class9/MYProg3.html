<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box
        {
            position: relative;
            width: 500px;
            height: 500px;
            left: 50px;
            top: 50px;
            border: 3px solid black;
            background-color: lightgray;
        }
        .box2
        {
            position : absolute;
            width: 500px;
            height: 500px;
            left: 50px;
            top: 50px;
            border: 3px solid black;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div class="box">
        MY DIV CONTENT
    </div>
    <div>this is another div</div>
    <div class="box2">
        ANOTHER BOX CONTENT
    </div>
</body>
</html>
