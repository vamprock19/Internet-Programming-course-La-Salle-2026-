<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            position: relative;
            width: 500px;
            height: 500px;
            left: 50px;
            top: 50px;
            border: 3px solid black;
            background-color: rgb(182, 71, 71);
        }
        .box
        {
            position: absolute;
            width: 500px;
            height: 500px;
            left: 50px;
            top: 50px;
            border: 3px solid black;
            background-color: rgb(211, 211, 211);
        }
        .box1{
            position: relative;
            width: 500px;
            height: 500px;
            left: 70px;
            top: 70px;
            border: 3px solid black;
            background-color: rgb(153, 34, 139);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            MY DIV CONTENT
        </div>
        <div class="box1">
            ANOTHER BOX CONTENT
        </div>
    </div>
</body>
</html>
