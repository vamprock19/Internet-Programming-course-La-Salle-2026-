<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            /*BAckground*/
            *
            {
              background-color: rgb(9, 9, 9);
            }
            /*PARAGRAPH STYLING*/
            p
            {
                color: white;
                font-weight: bold;

            }
            /*HEADING STYLING*/
            .h
            {
                color: red;
                font-style: italic;

            }
            #myh3
            {
                color: green;
                text-decoration: underline;
            }
            /*BUTTON BACKGROUND AND TEXT*/
            button , a
            {
                background-color: rgb(150, 145, 150);
                color: black;
            }
            input
            {
                border: 1px solid black;
                background-color: white;

            }
            input[type="password"]
            {
                border: 1px solid red;
                background-color: lightpink;

            }
            nav > a
            {
                text-decoration: none;
                background-color: lightblue;

            }
        </style>

    </head>



    <body>
        <!-- LINKS TO OTHER PAGES -->
        <nav>
            <a href="#">HOME</a>
            <a href="#">About</a>
            <a href="#">CONTACT</a>
        </nav>

        <h1 class="h"> This is a heading </h1>
        <h1 class="h"> This is yet another heading</h1>
        <h1>This is another heading</h1>
        <p> This is a paragraph </p>
        <p class="h"> This is a paragraph with a class h</p>

        <h3> This is a heading level 3</h3>
        <h3 id="myh3"> This is another heading level 3</h3>

        <button>Click me</button>
        <button>Submit</button>

        <a href="#"> This is a link</a>
        <input type="text" placeholder="Enter text here">
        <input type="password" placeholder="Enter password here">
    </body>
</html>
