<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            box-sizing: border-box;
        }
        body 
        {
            background-color: lightgray;
        }

        .grid-container 
        {
            display: grid;
            grid-template-columns: 25% 25% 50% ;
            grid-template-rows: 100px 100px;
            gap: 15px;
        }
        .item 
        {
            background-color: lightblue;
            place-items: center;
            text-align: center;
        }

        .grid2
        {
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: 100px 100px;
            gap: 15px;
        }
        .it2 
        {
            background-color: lightgreen;
            place-items: center;
            text-align: center;
        }


        .it3 
        {
            background-color: lightcoral;
            place-items: center;
            text-align: center;
        }

        .grid3
        {
            display: grid;
            grid-template-columns: repeat(6, 1fr);

            gap: 15px;
        }


    </style>
</head>
<body>

    <div class="grid-container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>


    <div class="grid2">
        <div class="it2">1</div>
        <div class="it2">2</div>
        <div class="it2">3</div>
        <div class="it2">4</div>
    </div>


    <div class="grid3">
        <div class="it3">1</div>
        <div class="it3">2</div>
        <div class="it3">3</div>
        <div class="it3">4</div>
        <div class="it3">5</div>
        <div class="it3">6</div>
        <div class="it3">7</div>
        <div class="it3">8</div>
        <div class="it3">9</div>
        <div class="it3">10</div>
        <div class="it3">11</div>
        <div class="it3">12</div>
        <div class="it3">13</div>
        <div class="it3">14</div>
        <div class="it3">15</div>
    </div>
    
</body>
</html>
