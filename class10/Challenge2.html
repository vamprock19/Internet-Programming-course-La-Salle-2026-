<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      * 
      {
        box-sizing: border-box;
      }

      .grid-container 
      {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(3, 200px);
       
      }

      .card 
      {
        background-color: #d0c8e8;
        border-radius: 6px;
        padding: 15px;
        margin: 10px;
      }

      .card1 
      {
        grid-column: span 4;
      }

      .card3 
      {
        grid-column: span 3;

      }

      .card4 
      {
        grid-column: span 2;
      }

      .card5 
      {
        grid-column: span 5;
      }
    </style>
  </head>
  <body>
    <h1>CSS Grid Challenge 2</h1>

    <div class="grid-container">
      <div class="card card1">
        <h2>Card 1</h2>
        <p>This card spans three columns.</p>
      </div>

      <div class="card card2">
        <h2>Card 2</h2>
        <p>This card occupies one column.</p>
      </div>

      <div class="card card3">
        <h2>Card 3</h2>
        <p>This card spans two columns.</p>
      </div>

      <div class="card card4">
        <h2>Card 4</h2>
        <p>This card spans two columns.</p>
      </div>

      <div class="card card5">
        <h2>Card 5</h2>
        <p>This card spans all four columns.</p>
      </div>
    </div>
  </body>
</html>
