
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Challenge 3</title>

    <style>
        * 
        {
            box-sizing: border-box;
        }


        .grid-container 
        {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 200px);
            gap: 15px;
        }

        .card 
        {
            background-color: #b2a8d4;
            border-radius: 6px;
            padding: 15px;
            min-width: 0;
        }

        .card1 
        {
            grid-column: span 3;
            grid-row: span 2;
        }

     

    </style>
</head>
<body>

    <h1>CSS Grid Challenge 3</h1>

    <div class="grid-container">
        <div class="card card1">
            <h2>Card 1 </h2>
            <p>This large card spans three columns and two rows.</p>
        </div>

        <div class="card card2">
            <h2>Card 2</h2>
            <p>This card appears at the top-right.</p>
        </div>

        <div class="card card3">
            <h2>Card 3</h2>
            <p>This card appears below Card 2.</p>
        </div>

        <div class="card card4">
            <h2>Card 4</h2>
            <p>Bottom-left card.</p>
        </div>

        <div class="card card5">
            <h2>Card 5</h2>
            <p>Bottom-center-left card.</p>
        </div>

        <div class="card card6">
            <h2>Card 6</h2>
            <p>Bottom-center-right card.</p>
        </div>

        <div class="card card7">
            <h2>Card 7</h2>
            <p>Bottom-right card.</p>
        </div>
    </div>

</body>
</html>
